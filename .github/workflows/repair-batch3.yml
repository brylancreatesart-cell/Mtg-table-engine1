name: Repair batch 3 - identity storage boundary

on:
  push:
    branches:
      - sidekick-refactor
    paths:
      - .github/workflows/repair-batch3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sidekick-refactor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply identity storage boundary repair
        run: python tools/apply_repair_batch3.py
      - name: Rebuild generated runtime
        run: python tools/build_runtime_from_source.py
      - name: Verify JavaScript syntax
        run: node --check scripts/inline-101.js
      - name: Verify guest/account isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/inline-101.js').read_text()
          forbidden=["localStorage.getItem('mtgte_commander')","localStorage.getItem('mtgte_partner')","localStorage.setItem('mtgte_commander'","localStorage.setItem('mtgte_partner'"]
          for x in forbidden: assert x not in s,x
          assert "clearLegacyGuestPersistence();MTGCloudAccount.clearMemory()" in s
          assert "if(restoredDeck)hydrateProfileFromSavedDeck(restoredDeck)" in s
          print('Guest/account deck identity isolation verified.')
          PY
      - name: Commit repair
        run: |
          git config user.name "sidekick-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/app-src scripts/inline-101.js runtime-build-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Isolate guest and account deck identity state"
          git push origin HEAD:sidekick-refactor
