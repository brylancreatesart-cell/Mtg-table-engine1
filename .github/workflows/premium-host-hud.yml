name: Premium Host HUD cohesion
# canonical source -> generated runtime

on:
  push:
    branches:
      - premium-cohesion-pass
    paths:
      - .github/workflows/premium-host-hud.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: premium-cohesion-pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply premium Host HUD pass to canonical source
        run: python tools/apply_premium_host_hud.py
      - name: Rebuild generated runtime from canonical source
        run: python tools/build_runtime_from_source.py
      - name: Verify Host HUD ownership and runtime syntax
        run: |
          node --check scripts/inline-101.js
          python - <<'PY'
          from pathlib import Path
          css=Path('styles/inline-01.css').read_text()
          html=Path('index.html').read_text()
          base_tabs='.hostTabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:10px 0 12px;overflow:visible}'
          base_tab='.hostTab{min-width:0;white-space:nowrap;border:1px solid #263d4d;background:#071119;color:#8ea2b0;border-radius:10px;padding:10px 7px;font-size:9px;font-weight:950;letter-spacing:.055em;transition:border-color .18s,background .18s,color .18s,box-shadow .18s}'
          assert 'AUTHORITATIVE TABLE CONTROL' in html
          assert '>Host Command<' in html
          assert 'RETURN TO PLAYER HUD' in html
          assert css.count(base_tabs)==1
          assert css.count(base_tab)==1
          assert '.hostTab[data-host-tab="judge"]' in css
          assert '@media(max-width:700px){.hostTabs{grid-template-columns:repeat(3,minmax(0,1fr))}' in css
          shell=css[css.find('.hostAuthorityIdentity{'):css.find('.hostAuthorityIdentity{')+3500]
          assert '!important' not in shell
          print('Host HUD premium ownership verified, including responsive variants.')
          PY
      - name: Run authoritative sync QA
        run: node tools/run_authoritative_sync_qa.js
      - name: Commit Host HUD pass
        run: |
          git config user.name "sidekick-premium-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles/inline-01.css styles/app-src runtime-build-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Polish separate Host HUD command center"
          git push origin HEAD:premium-cohesion-pass
