name: Phone-down deployed preview smoke

on:
  push:
    branches:
      - premium-cohesion-pass
    paths:
      - .github/workflows/phone-down-preview-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://mtg-table-engine1-git-premium-cohe-6cdabc-brylancreatesart-7523.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: premium-cohesion-pass
      - name: Wait for phone-down preview
        run: |
          for i in $(seq 1 36); do
            js=$(curl -L -s -o /tmp/app.js -w '%{http_code}' "$PREVIEW_URL/scripts/inline-101.js" || true)
            css=$(curl -L -s -o /tmp/app.css -w '%{http_code}' "$PREVIEW_URL/styles/inline-01.css" || true)
            if [ "$js" = "200" ] && [ "$css" = "200" ] && grep -q 'function companionAttentionState' /tmp/app.js && grep -q 'SIDEKICK MONITORING · TAP FOR CONTROLS' /tmp/app.js && grep -q '.battleScreen.companionAttention .playerHud' /tmp/app.css; then
              echo 'Phone-down preview ready'; exit 0
            fi
            echo "Waiting for phone-down preview $i ($js/$css)"; sleep 5
          done
          exit 1
      - name: Verify authoritative sync
        run: node tools/run_authoritative_sync_qa.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run phone-down deployed smoke
        run: node tools/phone_down_preview_smoke.js
      - name: Verify report
        run: |
          node - <<'JS'
          const r=require('./phone-down-smoke-report.json');
          if(!r.ok) throw new Error('Phone-down smoke not green');
          const n=r.checks.map(x=>x.name);
          for(const x of ['opponent-turn player enters passive Sidekick mode','tap immediately reopens full controls','manual wake automatically returns to passive mode after grace period','no uncaught browser errors']) if(!n.includes(x))throw new Error('Missing '+x);
          console.log('Phone-down Sidekick deployed behavior passed.');
          JS
