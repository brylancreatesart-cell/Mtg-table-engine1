name: Repair batch 6 - avatar visual ownership

on:
  push:
    branches:
      - sidekick-refactor
    paths:
      - .github/workflows/repair-batch6.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sidekick-refactor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply direct avatar visual owner repair
        run: python tools/apply_repair_batch6.py
      - name: Refresh stylesheet source fragments
        run: python tools/split_styles_source.py
      - name: Rebuild generated runtime from source
        run: python tools/build_runtime_from_source.py
      - name: Verify runtime syntax and visual ownership
        run: |
          node --check scripts/inline-101.js
          python - <<'PY'
          from pathlib import Path
          css=Path('styles/inline-01.css').read_text()
          html=Path('index.html').read_text()
          assert 'premiumExternalAvatarAssets' not in html
          assert html.count('<style')==0, 'Inline style blocks remain in index.html'
          assert css.count('.fantasyAvatar.portraitAvatar{')==1
          assert '.fantasyAvatar.portraitAvatar{background:transparent;border-radius:0;overflow:visible;box-shadow:none}' in css
          assert '.fantasyAvatar.portraitAvatar img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;transform:none;filter:none}' in css
          assert '.battleActive .hudAvatar{background:radial-gradient' not in css
          assert '.hudAvatar{border-color:color-mix(in srgb,var(--deck-a)' not in css
          assert '.avatarMount,.hudAvatar{overflow:visible}' in css
          print('Avatar visual ownership is canonical; inline override removed.')
          PY
      - name: Commit repair
        run: |
          git config user.name "sidekick-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles/inline-01.css styles/app-src styles-source-report.json runtime-build-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Replace stacked avatar overrides with canonical CSS owners"
          git push origin HEAD:sidekick-refactor
