name: Premium cohesion pass 1

on:
  push:
    branches:
      - premium-cohesion-pass
    paths:
      - .github/workflows/premium-cohesion-pass1.yml
      - tools/apply_premium_cohesion_pass1.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: premium-cohesion-pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply canonical premium cohesion edits
        run: python tools/apply_premium_cohesion_pass1.py
      - name: Rebuild runtime from canonical source
        run: python tools/build_runtime_from_source.py
      - name: Verify runtime syntax and canonical replacements
        run: |
          node --check scripts/inline-101.js
          python - <<'PY'
          from pathlib import Path
          css=Path('styles/inline-01.css').read_text()
          js=Path('scripts/inline-101.js').read_text()
          old=[
            '.lobbyAtmosphere{position:absolute;inset:-12px 0 auto;height:260px',
            '.readyHeadline{font-size:12px;font-weight:900;letter-spacing:.08em}',
            '.readyRitual{display:grid;grid-template-columns:64px 1fr;gap:11px;align-items:center;margin-top:11px;padding:10px',
            '.battleIntro{position:fixed;z-index:95;inset:0;background:radial-gradient(circle at 50% 35%,#10283a',
            '.battleIntroPanel{width:min(760px,100%);text-align:center}',
            '.battleIntroPlayer{display:grid;grid-template-columns:50px 1fr;gap:10px',
            '.playerHud{position:relative;border:1px solid #244257;background:linear-gradient(180deg,#0b1822,#071019)'
          ]
          for x in old: assert x not in css,x
          required=[
            '.lobbyAtmosphere{position:absolute;inset:-18px -10px auto;height:300px',
            '.readyHeadline{font-size:13px;font-weight:950;letter-spacing:.095em',
            '.readyRitual{display:grid;grid-template-columns:64px 1fr;gap:11px;align-items:center;margin-top:11px;padding:11px',
            '.battleIntro{position:fixed;z-index:95;inset:0;isolation:isolate;overflow:hidden',
            '.battleIntroPanel{width:min(760px,100%);text-align:center;padding:clamp(18px,4vw,34px)',
            '.battleIntroPlayer{display:grid;grid-template-columns:54px 1fr;gap:11px',
            '.playerHud{position:relative;border:1px solid color-mix(in srgb,var(--deck-a,#52b8ff) 30%,#244257)'
          ]
          for x in required: assert css.count(x)==1,(x,css.count(x))
          assert js.count('function battleIntroDeckAccent(')==1
          assert js.count('LET THE BATTLE BEGIN')==1
          assert "lobbyDeckName+' is loaded · host or join a room when you are ready.'" in js
          print('Canonical premium replacements verified; responsive and state variants preserved.')
          PY
      - name: Run authoritative multiplayer QA
        run: node tools/run_authoritative_sync_qa.js
      - name: Commit premium pass
        run: |
          git config user.name "sidekick-premium-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/app-src/styles-part-01.part.css scripts/app-src/controller-part-04.part.js scripts/app-src/controller-part-05.part.js styles/inline-01.css scripts/inline-101.js runtime-build-report.json authoritative-sync-qa.json
          git diff --cached --quiet && exit 0
          git commit -m "Polish personalized lobby and battlefield entry"
          git push origin HEAD:premium-cohesion-pass
