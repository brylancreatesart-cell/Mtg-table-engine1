name: Premium cohesion pass 3

on:
  push:
    branches:
      - premium-cohesion-pass
    paths:
      - .github/workflows/premium-cohesion-pass3.yml
      - tools/apply_premium_cohesion_pass3.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: premium-cohesion-pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply battlefield HUD hierarchy and ownership cleanup
        run: python tools/apply_premium_cohesion_pass3.py
      - name: Rebuild generated runtime
        run: python tools/build_runtime_from_source.py
      - name: Verify HUD ownership and runtime syntax
        run: |
          node --check scripts/inline-101.js
          python - <<'PY'
          from pathlib import Path
          css=Path('styles/inline-01.css').read_text()
          required=[
            '.hudIdentity{display:grid;grid-template-columns:58px minmax(0,1fr) auto',
            '.priorityPill.mine{color:#f4fbff;border-color:color-mix',
            '.turnStrip{display:flex;justify-content:space-between;align-items:center',
            '.lifeButton{font-size:clamp(74px,19vw,94px)',
            '.dock{position:fixed;z-index:30;left:50%',
            '.dk{flex:1 1 0;max-width:196px;min-width:0'
          ]
          for x in required: assert css.count(x)==1,(x,css.count(x))
          assert '.contextualDock{position:fixed!important' not in css
          assert '.contextualDock .dk{flex:1 1 0!important' not in css
          assert '.lifeUniversal .lifeButton{font-size:' not in css
          print('HUD hierarchy and direct dock ownership verified.')
          PY
      - name: Run authoritative sync QA
        run: node tools/run_authoritative_sync_qa.js
      - name: Commit pass 3
        run: |
          git config user.name "sidekick-premium-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/app-src/styles-part-01.part.css styles/inline-01.css runtime-build-report.json authoritative-sync-qa.json
          git diff --cached --quiet && exit 0
          git commit -m "Sharpen battlefield HUD hierarchy and consolidate action dock ownership"
          git push origin HEAD:premium-cohesion-pass
