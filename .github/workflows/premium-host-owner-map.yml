name: Map Host HUD owners

on:
  push:
    branches:
      - premium-cohesion-pass
    paths:
      - .github/workflows/premium-host-owner-map.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: premium-cohesion-pass
          fetch-depth: 0
      - name: Map Host HUD CSS and renderer owners
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          selectors=['.hostTopbar','.hostTabs','.hostTab','.hostTab.active','.hostPanel','.hostPlayer','.hostPlayerMain','.hostStackItem','.hostMini','.hostScreen']
          funcs=['showHostControl','renderHost','hostPrefs','hostApply','hostAdjustPlayer','hostCommanderDamage','hostUndo']
          out={'css':{},'js':{}}
          for p in sorted(Path('styles/app-src').glob('*.css')):
              text=p.read_text(errors='ignore')
              for sel in selectors:
                  hits=[]
                  for m in re.finditer(re.escape(sel),text):
                      start=max(text.rfind('}',0,m.start())+1,text.rfind('{',0,m.start())+1 if False else 0)
                      end=text.find('}',m.start())
                      if end<0: continue
                      rule=text[text.rfind('}',0,m.start())+1:end+1].strip()
                      hits.append({'file':str(p),'offset':m.start(),'rule':rule})
                  if hits: out['css'].setdefault(sel,[]).extend(hits)
          for p in sorted(Path('scripts/app-src').glob('*.js')):
              text=p.read_text(errors='ignore')
              matches=list(re.finditer(r'(?m)^(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',text))
              for i,m in enumerate(matches):
                  name=m.group(1)
                  if name not in funcs: continue
                  end=matches[i+1].start() if i+1<len(matches) else len(text)
                  out['js'][name]={'file':str(p),'line':text.count('\n',0,m.start())+1,'body':text[m.start():end][:30000]}
          Path('premium-host-owner-map.json').write_text(json.dumps(out,indent=2)+'\n')
          print('CSS:',{k:len(v) for k,v in out['css'].items()})
          print('JS:',{k:v['file'] for k,v in out['js'].items()})
          PY
      - name: Commit owner map
        run: |
          git config user.name "sidekick-premium-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add premium-host-owner-map.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Host HUD ownership map"
          git push origin HEAD:premium-cohesion-pass
