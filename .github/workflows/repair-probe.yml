name: Sidekick branch preview battlefield smoke

on:
  push:
    branches:
      - sidekick-refactor
    paths:
      - .github/workflows/repair-probe.yml
      - tools/preview_smoke_test.js
      - scripts/inline-10.js
      - sw.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://mtg-table-engine1-git-sidekick-refactor-brylancreatesart-7523.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sidekick-refactor
          fetch-depth: 0
      - name: Verify transport and authoritative sync syntax
        run: |
          node --check scripts/inline-10.js
          node --check scripts/inline-95.js
          node tools/run_authoritative_sync_qa.js
      - name: Wait for repaired preview
        run: |
          for i in $(seq 1 36); do
            code=$(curl -L -s -o /tmp/preview.html -w '%{http_code}' "$PREVIEW_URL" || true)
            sw=$(curl -L -s -o /tmp/sw.js -w '%{http_code}' "$PREVIEW_URL/sw.js" || true)
            js=$(curl -L -s -o /tmp/gateway.js -w '%{http_code}' "$PREVIEW_URL/scripts/inline-10.js" || true)
            smoke=$(curl -L -s -o /tmp/app.js -w '%{http_code}' "$PREVIEW_URL/scripts/inline-101.js" || true)
            if [ "$code" = "200" ] && [ "$sw" = "200" ] && [ "$js" = "200" ] && [ "$smoke" = "200" ] && grep -q 'phase108-live-transport-gateway-5' /tmp/gateway.js; then
              echo "Preview ready"
              exit 0
            fi
            echo "Preview not ready yet (page=$code sw=$sw gateway=$js app=$smoke), retry $i/36"
            sleep 5
          done
          exit 1
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run deployed battlefield smoke test
        run: node tools/preview_smoke_test.js
      - name: Commit smoke report
        if: always()
        run: |
          test -f preview-smoke-report.json || exit 0
          git config user.name "sidekick-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-smoke-report.json authoritative-sync-qa.json
          git diff --cached --quiet && exit 0
          git commit -m "Record battlefield preview smoke results"
          git push origin HEAD:sidekick-refactor
