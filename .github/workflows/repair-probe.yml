name: Sidekick refactor cleanup

on:
  push:
    branches:
      - sidekick-refactor
    paths:
      - .github/workflows/repair-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sidekick-refactor
          fetch-depth: 0
      - name: Remove one-off probes and repair runners
        run: |
          rm -f \
            account-runtime-probe.json \
            avatar-owner-summary.txt \
            avatar-visual-owner-probe.json \
            deck-theme-handoff-probe.txt \
            duplicate-id-report.json \
            multiplayer-runtime-probe.json \
            portrait-avatar-owner-summary.txt \
            ready-control-probe.txt \
            reconnect-host-probe.json \
            reconnect-module-qa.json \
            repair-targets.json
          rm -f .github/workflows/repair-batch*.yml
          rm -f .github/workflows/refactor-split.yml
          rm -f .github/workflows/controller-source-split.yml
          rm -f tools/apply_repair_batch*.py
          rm -f tools/refactor_monolith.py
      - name: Preserve reusable validation and source tooling
        run: |
          test -f tools/build_runtime_from_source.py
          test -f tools/run_authoritative_sync_qa.js
          test -f tools/preview_smoke_test.js
          test -d scripts/app-src
          test -d styles/app-src
          test -f .github/workflows/rebuild-runtime.yml
          test -f authoritative-sync-qa.json
          test -f preview-smoke-report.json
      - name: Commit cleanup
        run: |
          git config user.name "sidekick-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove one-off refactor probes and repair runners"
          git push origin HEAD:sidekick-refactor
