name: Sidekick multiplayer runtime probe

on:
  push:
    branches:
      - sidekick-refactor
    paths:
      - .github/workflows/repair-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_URL: https://mtg-table-engine1-git-sidekick-refactor-brylancreatesart-7523.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sidekick-refactor
          fetch-depth: 0
      - name: Probe external PeerJS and service worker references
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          out={"references":[]}
          for p in [Path('index.html'),*sorted(Path('scripts').glob('inline-*.js'))]:
              text=p.read_text(errors='ignore')
              for term in ['serviceWorker','sw.js','peerjs','unpkg.com/peerjs']:
                  for m in re.finditer(re.escape(term),text,re.I):
                      s=max(0,m.start()-450);e=min(len(text),m.end()+900)
                      out['references'].append({'path':str(p),'term':term,'context':text[s:e]})
                      if len(out['references'])>=50: break
                  if len(out['references'])>=50: break
              if len(out['references'])>=50: break
          def curl(url):
              cp=subprocess.run(['curl','-L','-sS','-o','/tmp/body','-w','%{http_code} %{url_effective}',url],capture_output=True,text=True)
              return {'requested':url,'result':cp.stdout.strip(),'stderr':cp.stderr.strip()}
          out['peerjs']=curl('https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js')
          out['preview_sw']=curl('https://mtg-table-engine1-git-sidekick-refactor-brylancreatesart-7523.vercel.app/sw.js')
          Path('multiplayer-runtime-probe.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Commit probe report
        run: |
          git config user.name "sidekick-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add multiplayer-runtime-probe.json
          git diff --cached --quiet && exit 0
          git commit -m "Record multiplayer runtime script probe"
          git push origin HEAD:sidekick-refactor
