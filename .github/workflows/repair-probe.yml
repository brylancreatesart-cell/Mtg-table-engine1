name: Probe first repair targets

on:
  push:
    branches:
      - sidekick-refactor
    paths:
      - .github/workflows/repair-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sidekick-refactor
          fetch-depth: 0
      - name: Locate cloud-account implementation and startup callers
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          terms=['MTGCloudAccount','loadProfile()','clearMemory','signedIn','currentUser','loadProfileRow']
          out={'matches':[]}
          for p in sorted(Path('scripts').glob('inline-*.js')):
              text=p.read_text(errors='ignore')
              if not any(t in text for t in terms):
                  continue
              hits=[]
              for t in terms:
                  for m in re.finditer(re.escape(t),text):
                      s=max(0,m.start()-1200);e=min(len(text),m.end()+2800)
                      hits.append({'term':t,'line':text.count('\n',0,m.start())+1,'context':text[s:e]})
                      if len(hits)>=12: break
                  if len(hits)>=12: break
              if hits: out['matches'].append({'path':str(p),'hits':hits})
          Path('account-runtime-probe.json').write_text(json.dumps(out,indent=2)+'\n')
          print('matched files:',[x['path'] for x in out['matches']])
          PY
      - name: Commit probe report
        run: |
          git config user.name "sidekick-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add account-runtime-probe.json
          git diff --cached --quiet && exit 0
          git commit -m "Record account runtime probe"
          git push origin HEAD:sidekick-refactor
