name: Sidekick branch repair runner

on:
  push:
    branches:
      - sidekick-refactor
    paths:
      - .github/workflows/repair-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sidekick-refactor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply live active deck propagation repair
        run: python tools/apply_repair_batch8.py
      - name: Rebuild generated runtime
        run: python tools/build_runtime_from_source.py
      - name: Verify JavaScript syntax
        run: node --check scripts/inline-101.js
      - name: Verify propagation invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/inline-101.js').read_text()
          assert 'function propagateActiveDeckSelection()' in s
          assert 'syncLocalProfilePresence({broadcast:true})' in s
          assert 'hydrateProfileFromSavedDeck(d);propagateActiveDeckSelection();renderDeckLibrary()' in s
          assert 'if(wasActive)propagateActiveDeckSelection()' in s
          assert s.count('propagateActiveDeckSelection();') >= 5
          print('Active deck changes propagate through live room presence.')
          PY
      - name: Commit repair
        run: |
          git config user.name "sidekick-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/app-src scripts/inline-101.js runtime-build-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Propagate active deck changes to live room presence"
          git push origin HEAD:sidekick-refactor
