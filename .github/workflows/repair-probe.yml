name: Sidekick branch repair runner

on:
  push:
    branches:
      - sidekick-refactor
    paths:
      - .github/workflows/repair-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sidekick-refactor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply shared display reconnect hardening
        run: python tools/apply_repair_batch9.py
      - name: Rebuild generated runtime
        run: python tools/build_runtime_from_source.py
      - name: Verify JavaScript syntax
        run: node --check scripts/inline-101.js
      - name: Verify display reconnect invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/inline-101.js').read_text()
          assert "function scheduleSharedDisplayReconnect(reason='retry',delay=1800)" in s
          assert "scheduleSharedDisplayReconnect('connection-close',1800)" in s
          assert "scheduleSharedDisplayReconnect('peer-disconnected',1800)" in s
          assert "scheduleSharedDisplayReconnect('peer-error',3000)" in s
          assert 'generation!==sharedDisplayConnectGeneration' in s
          print('Shared display reconnect is guarded across data, peer disconnect, and peer error paths.')
          PY
      - name: Commit repair
        run: |
          git config user.name "sidekick-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/app-src scripts/inline-101.js runtime-build-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Harden shared display reconnect scheduling"
          git push origin HEAD:sidekick-refactor
