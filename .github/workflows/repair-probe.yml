name: Sidekick ready-up control probe

on:
  push:
    branches:
      - sidekick-refactor
    paths:
      - .github/workflows/repair-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sidekick-refactor
          fetch-depth: 0
      - name: Extract ready-up control functions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('scripts/inline-101.js').read_text(errors='ignore')
          names=['librarySetupForPlayer','showLibraryControl','markReadyNow']
          out=[]
          matches=list(re.finditer(r'(?m)^function\s+([A-Za-z_$][\w$]*)\s*\(',text))
          by={m.group(1):(i,m) for i,m in enumerate(matches)}
          for name in names:
              if name not in by: continue
              i,m=by[name]
              end=matches[i+1].start() if i+1<len(matches) else len(text)
              out.append('===== '+name+' =====\n'+text[m.start():end][:16000])
          # also capture the ready/start handler area
          pos=text.find("$('rdy').onclick")
          if pos>=0: out.append('===== ready handlers =====\n'+text[max(0,pos-1500):pos+6000])
          Path('ready-control-probe.txt').write_text('\n\n'.join(out)+'\n')
          print('captured', [n for n in names if n in by])
          PY
      - name: Commit probe
        run: |
          git config user.name "sidekick-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ready-control-probe.txt
          git diff --cached --quiet && exit 0
          git commit -m "Record ready-up control probe"
          git push origin HEAD:sidekick-refactor
