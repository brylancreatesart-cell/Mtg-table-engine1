name: Probe first repair targets

on:
  push:
    branches:
      - sidekick-refactor
    paths:
      - .github/workflows/repair-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sidekick-refactor
          fetch-depth: 0
      - name: Map post-verify deck-theme handoff
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          terms=['MTGDeckTheme','applyDeckTheme','activeDeckTheme','--deck-a','--deck-b','showLobbyPage','Continue to Lobby','saveCurrentDeck','persistActiveDeckSelection']
          rows=[]
          for p in [*sorted(Path('scripts').glob('inline-*.js')),Path('styles/inline-01.css')]:
              text=p.read_text(errors='ignore')
              hits=[]
              for term in terms:
                  for m in re.finditer(re.escape(term),text):
                      s=max(0,m.start()-900);e=min(len(text),m.end()+1800)
                      hits.append((m.start(),term,text[s:e]))
                      if len(hits)>=30:break
                  if len(hits)>=30:break
              if hits:
                  rows.append('FILE '+str(p))
                  for pos,term,ctx in sorted(hits)[:30]:rows.append(f'\nTERM {term} OFFSET {pos}\n{ctx}\n')
          Path('deck-theme-handoff-probe.txt').write_text('\n'.join(rows))
          print('theme files mapped:',sum(1 for x in rows if x.startswith('FILE ')))
          PY
      - name: Commit probe report
        run: |
          git config user.name "sidekick-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deck-theme-handoff-probe.txt
          git diff --cached --quiet && exit 0
          git commit -m "Map post-verify deck theme handoff"
          git push origin HEAD:sidekick-refactor
