name: Sidekick branch preview smoke

on:
  push:
    branches:
      - sidekick-refactor
    paths:
      - .github/workflows/repair-probe.yml
      - tools/preview_smoke_test.js
      - sw.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://mtg-table-engine1-git-sidekick-refactor-brylancreatesart-7523.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sidekick-refactor
          fetch-depth: 0
      - name: Wait for current preview alias and service worker
        run: |
          for i in $(seq 1 36); do
            code=$(curl -L -s -o /tmp/preview.html -w '%{http_code}' "$PREVIEW_URL" || true)
            sw=$(curl -L -s -o /tmp/sw.js -w '%{http_code}' "$PREVIEW_URL/sw.js" || true)
            if [ "$code" = "200" ] && [ "$sw" = "200" ] && grep -q 'MTG Table Engine' /tmp/preview.html; then
              echo "Preview and service worker ready"
              exit 0
            fi
            echo "Preview not ready yet (page=$code sw=$sw), retry $i/36"
            sleep 5
          done
          echo "Current preview did not become ready" >&2
          exit 1
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run deployed Chromium smoke test
        run: node tools/preview_smoke_test.js
      - name: Commit smoke report
        if: always()
        run: |
          test -f preview-smoke-report.json || exit 0
          git config user.name "sidekick-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-smoke-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Record deployed preview smoke results"
          git push origin HEAD:sidekick-refactor
