name: Sidekick branch repair runner

on:
  push:
    branches:
      - sidekick-refactor
    paths:
      - .github/workflows/repair-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sidekick-refactor
          fetch-depth: 0
      - name: Verify module syntax
        run: |
          node --check scripts/inline-95.js
          node --check tools/run_authoritative_sync_qa.js
      - name: Run dependency-aware authoritative sync QA
        run: node tools/run_authoritative_sync_qa.js
      - name: Commit QA report
        run: |
          git config user.name "sidekick-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authoritative-sync-qa.json
          git diff --cached --quiet && exit 0
          git commit -m "Record dependency-aware authoritative sync QA"
          git push origin HEAD:sidekick-refactor
