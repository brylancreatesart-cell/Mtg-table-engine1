name: Repair batch 4 - returning account session

on:
  push:
    branches:
      - sidekick-refactor
    paths:
      - .github/workflows/repair-batch4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sidekick-refactor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply returning-account session repair
        run: python tools/apply_repair_batch4.py
      - name: Rebuild generated controller runtime
        run: python tools/build_runtime_from_source.py
      - name: Verify JavaScript syntax
        run: |
          node --check scripts/inline-100.js
          node --check scripts/inline-101.js
      - name: Verify session restoration contract
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('scripts/inline-100.js').read_text()
          c=Path('scripts/inline-101.js').read_text()
          assert "SESSION_KEY='mtgte_supabase_session_v1'" in a
          assert 'async function restoreSession()' in a
          assert "grant_type=refresh_token" in a
          assert "VERSION:'supabase-account-front-door-2'" in a
          assert 'async function loadProfile()' in c
          assert "await MTGCloudAccount.restoreSession?.()" in c
          assert "MTGCloudAccount.forgetSession?.();MTGCloudAccount.clearMemory();" in c
          assert 'password' not in a[a.find('function persistSession'):a.find('async function restoreSession')]
          print('Returning-account session restoration contract verified.')
          PY
      - name: Commit repair
        run: |
          git config user.name "sidekick-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/inline-100.js scripts/app-src scripts/inline-101.js runtime-build-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Restore returning authenticated sessions safely"
          git push origin HEAD:sidekick-refactor
