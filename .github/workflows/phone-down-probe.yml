name: Probe phone-down wake paths

on:
  push:
    branches:
      - premium-cohesion-pass
    paths:
      - .github/workflows/phone-down-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: premium-cohesion-pass
      - name: Extract wake bindings and low-attention module
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          terms=['hudWakeBtn','MTGPlayerHUD','lowAttention:function','lowAttention(','forcedHudAwakeUntil','wakePlayerHud(']
          out=[]
          for p in sorted(Path('scripts').glob('inline-*.js')):
              text=p.read_text(errors='ignore')
              if not any(t in text for t in terms): continue
              hits=[]
              for term in terms:
                  for m in re.finditer(re.escape(term),text):
                      s=max(0,m.start()-1200);e=min(len(text),m.end()+3600)
                      hits.append({'term':term,'line':text.count('\n',0,m.start())+1,'context':text[s:e]})
                      if len(hits)>=16: break
                  if len(hits)>=16: break
              if hits: out.append({'file':str(p),'hits':hits})
          Path('phone-down-probe.json').write_text(json.dumps(out,indent=2)+'\n')
          print([x['file'] for x in out])
          PY
      - name: Commit probe
        run: |
          git config user.name "sidekick-premium-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phone-down-probe.json
          git diff --cached --quiet && exit 0
          git commit -m "Probe phone-down wake paths"
          git push origin HEAD:premium-cohesion-pass
