name: Split controller source safely

on:
  push:
    branches:
      - sidekick-refactor
    paths:
      - tools/split_controller_source.py
      - .github/workflows/controller-source-split.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-controller-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: sidekick-refactor
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Split controller into byte-exact source fragments
        run: python tools/split_controller_source.py

      - name: Verify runtime controller syntax
        run: node --check scripts/inline-101.js

      - name: Verify byte-exact reconstruction
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          report = json.loads(Path('controller-source-report.json').read_text())
          source = Path(report['source']).read_bytes()
          rebuilt = b''.join(Path(p['path']).read_bytes() for p in report['parts'])
          assert rebuilt == source
          assert report['byte_exact'] is True
          assert hashlib.sha256(source).hexdigest() == report['source_sha256']
          assert hashlib.sha256(rebuilt).hexdigest() == report['reconstructed_sha256']
          print(f"Verified {len(report['parts'])} controller fragments; runtime unchanged.")
          PY

      - name: Commit source fragments only
        run: |
          git config user.name "sidekick-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/app-src controller-source-report.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Create byte-exact controller source fragments"
          git push origin HEAD:sidekick-refactor
