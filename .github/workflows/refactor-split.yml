name: Refactor monolithic index

on:
  workflow_dispatch:
  push:
    branches:
      - sidekick-refactor
    paths:
      - .github/workflows/refactor-split.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: sidekick-refactor
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Confirm mechanical index split is present
        shell: bash
        run: |
          test -s index.html
          test -s refactor-report.json
          test -s scripts/inline-101.js
          test -s styles/inline-01.css
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('refactor-report.json').read_text())
          assert report['styles_extracted'] >= 1
          assert report['scripts_extracted'] >= 1
          assert report['original_index_bytes'] > report['refactored_index_bytes']
          print('Mechanical split already present; preserving runtime assets.')
          PY

      - name: Create byte-exact controller source fragments
        run: python tools/split_controller_source.py

      - name: Verify runtime controller syntax
        run: node --check scripts/inline-101.js

      - name: Verify controller reconstruction
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          report = json.loads(Path('controller-source-report.json').read_text())
          source = Path(report['source']).read_bytes()
          rebuilt = b''.join(Path(p['path']).read_bytes() for p in report['parts'])
          assert rebuilt == source
          assert report['byte_exact'] is True
          assert hashlib.sha256(source).hexdigest() == report['source_sha256']
          assert hashlib.sha256(rebuilt).hexdigest() == report['reconstructed_sha256']
          print(f"Verified {len(report['parts'])} source fragments; browser runtime remains byte-identical.")
          PY

      - name: Commit maintainable controller source fragments
        shell: bash
        run: |
          git config user.name "sidekick-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/app-src controller-source-report.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Create byte-exact controller source fragments"
          git push origin HEAD:sidekick-refactor
