name: Refactor monolithic index

on:
  push:
    branches:
      - sidekick-refactor
    paths:
      - .github/workflows/refactor-split.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: sidekick-refactor
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract inline CSS and JavaScript
        run: python tools/split_monolith.py

      - name: Syntax-check extracted JavaScript
        shell: bash
        run: |
          shopt -s nullglob
          files=(scripts/inline-*.js)
          if (( ${#files[@]} == 0 )); then
            echo "No JavaScript files extracted"
          else
            for file in "${files[@]}"; do
              node --check "$file"
            done
          fi

      - name: Structural safety checks
        shell: bash
        run: |
          test -s index.html
          test -s refactor-report.json
          grep -q 'styles/inline-' index.html || true
          grep -q 'scripts/inline-' index.html || true
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('refactor-report.json').read_text())
          assert report['original_index_bytes'] > report['refactored_index_bytes']
          assert report['styles_extracted'] + report['scripts_extracted'] > 0
          print('Safety checks passed:', report)
          PY

      - name: Commit refactor output to sidekick-refactor only
        shell: bash
        run: |
          git config user.name "sidekick-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles scripts refactor-report.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Split monolithic index assets without behavior changes"
          git push origin HEAD:sidekick-refactor
