name: Map premium flow owners

on:
  push:
    branches:
      - premium-cohesion-pass
    paths:
      - .github/workflows/premium-owner-map.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: premium-cohesion-pass
          fetch-depth: 0
      - name: Map CSS and controller owners
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          css_targets=['.lobbyAtmosphere','.readyRitual','.readyHeadline','.rosterPreview','.battleIntro','.battleIntroPanel','.battleIntroPlayer','.playerHud','.hudIdentity','.turnStrip','.lifeStage','.contextualDock','.opponentsCard','.quickActionsCard']
          js_targets=['showLobbyPage','introRosterHtml','playBattleIntro','finishBattleIntro','showBattlePage','slots','renderDeckAdaptiveHud','hud']
          out={'css':{},'js':{}}
          for p in sorted(Path('styles/app-src').glob('styles-part-*.part.css')):
              text=p.read_text(errors='ignore')
              for target in css_targets:
                  hits=[]
                  for m in re.finditer(re.escape(target),text):
                      s=text.rfind('}',0,m.start())+1
                      e=text.find('}',m.start())
                      if e<0: e=min(len(text),m.end()+2500)
                      hits.append({'file':str(p),'offset':m.start(),'rule':text[s:e+1].strip()})
                  if hits:out['css'].setdefault(target,[]).extend(hits)
          for p in sorted(Path('scripts/app-src').glob('controller-part-*.part.js')):
              text=p.read_text(errors='ignore')
              funcs=list(re.finditer(r'(?m)^(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',text))
              for i,m in enumerate(funcs):
                  name=m.group(1)
                  if name not in js_targets:continue
                  end=funcs[i+1].start() if i+1<len(funcs) else len(text)
                  out['js'][name]={'file':str(p),'line':text.count('\n',0,m.start())+1,'body':text[m.start():end][:18000]}
          Path('premium-owner-map.json').write_text(json.dumps(out,indent=2)+'\n')
          print('css owners:',{k:len(v) for k,v in out['css'].items()})
          print('js owners:',list(out['js']))
          PY
      - name: Commit owner map
        run: |
          git config user.name "sidekick-premium-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add premium-owner-map.json
          git diff --cached --quiet && exit 0
          git commit -m "Record premium flow ownership map"
          git push origin HEAD:premium-cohesion-pass
