name: Phone-down companion behavior

on:
  push:
    branches:
      - premium-cohesion-pass
    paths:
      - .github/workflows/phone-down-companion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: premium-cohesion-pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply phone-down companion pass
        run: python tools/apply_phone_down_companion.py
      - name: Rebuild generated runtime
        run: python tools/build_runtime_from_source.py
      - name: Verify companion ownership and syntax
        run: |
          node --check scripts/inline-101.js
          python - <<'PY'
          from pathlib import Path
          css=Path('styles/inline-01.css').read_text()
          js=Path('scripts/inline-101.js').read_text()
          assert 'function companionAttentionState(' in js
          assert 'forcedHudAwakeTimer=setTimeout' in js
          assert "SIDEKICK MONITORING · TAP FOR CONTROLS" in js
          assert "lowCandidate&&!attention.required" in js
          assert '.battleScreen.companionAttention .playerHud{' in css
          assert 'hudWakeBtn{display:block!important}' not in css
          assert 'criticalHud .hudCriticalBanner{display:flex!important}' not in css
          print('Phone-down companion ownership and wake contract verified.')
          PY
      - name: Run Player HUD local QA
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const files=fs.readdirSync('scripts').filter(f=>/^inline-\d+\.js$/.test(f)).sort((a,b)=>Number(a.match(/\d+/)[0])-Number(b.match(/\d+/)[0]));
          const sandbox={console,localStorage:{getItem(){return null},setItem(){},removeItem(){}},globalThis:null,window:null};sandbox.globalThis=sandbox;sandbox.window=sandbox;vm.createContext(sandbox);
          for(const f of files){const s=fs.readFileSync('scripts/'+f,'utf8');if(s.includes('MTGPlayerHUD')){try{vm.runInContext(s,sandbox,{filename:f})}catch{}}}
          if(!sandbox.MTGPlayerHUD?.localQA)throw new Error('MTGPlayerHUD localQA unavailable');
          const r=sandbox.MTGPlayerHUD.localQA();console.log(r);if(!r.ok)throw new Error('Player HUD local QA failed');
          JS
      - name: Run authoritative sync QA
        run: node tools/run_authoritative_sync_qa.js
      - name: Commit phone-down pass
        run: |
          git config user.name "sidekick-premium-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/app-src styles/inline-01.css scripts/app-src scripts/inline-101.js runtime-build-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Make low-attention HUD behave like a phone-down Sidekick"
          git push origin HEAD:premium-cohesion-pass
