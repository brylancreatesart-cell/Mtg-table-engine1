name: Premium shared display centerpiece

on:
  push:
    branches:
      - premium-cohesion-pass
    paths:
      - .github/workflows/premium-shared-display.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: premium-cohesion-pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply shared display centerpiece pass
        run: python tools/apply_premium_shared_display.py
      - name: Rebuild runtime from canonical source
        run: python tools/build_runtime_from_source.py
      - name: Verify display ownership and syntax
        run: |
          node --check scripts/inline-101.js
          python - <<'PY'
          from pathlib import Path
          css=Path('styles/inline-01.css').read_text()
          js=Path('scripts/inline-101.js').read_text()
          assert '--shared-cols:1!important' not in css
          assert '.sharedDisplayIdentity .sharedDisplayDeckName' in css
          assert '.sharedDisplayIdentity .sharedDisplayPlayerState' in css
          assert "('TURN '+Number(s.turn||1)+' · '+String(s.phase||'').toUpperCase())" in js
          assert "deck=p.deckName||'DECK NOT SHARED'" in js
          print('Shared display premium ownership verified.')
          PY
      - name: Run authoritative sync QA
        run: node tools/run_authoritative_sync_qa.js
      - name: Commit shared display pass
        run: |
          git config user.name "sidekick-premium-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/app-src styles/inline-01.css scripts/app-src scripts/inline-101.js runtime-build-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Elevate shared table display presentation"
          git push origin HEAD:premium-cohesion-pass
