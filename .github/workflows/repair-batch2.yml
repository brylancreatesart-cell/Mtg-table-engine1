name: Repair batch 2 - verification state

on:
  push:
    branches:
      - sidekick-refactor
    paths:
      - .github/workflows/repair-batch2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sidekick-refactor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply verification-state repair
        run: python tools/apply_repair_batch2.py
      - name: Rebuild generated runtime
        run: python tools/build_runtime_from_source.py
      - name: Verify JavaScript syntax
        run: node --check scripts/inline-101.js
      - name: Verify stale-state guards
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/inline-101.js').read_text()
          assert 'function resetVerificationPresentation()' in s
          assert 'function clearInvalidVerificationState()' in s
          assert "names.has(String(commanderCandidate).trim().toLowerCase())" in s
          assert "return toast('Add a valid deck list first')" in s
          print('Verification stale-state guards present.')
          PY
      - name: Commit repair
        run: |
          git config user.name "sidekick-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/app-src scripts/inline-101.js runtime-build-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Reset stale deck verification state and commander selection"
          git push origin HEAD:sidekick-refactor
