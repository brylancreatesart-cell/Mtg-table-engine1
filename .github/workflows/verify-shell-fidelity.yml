name: Verify shell fidelity review gate

on:
  push:
    branches:
      - verify-shell-fidelity
    paths:
      - .github/workflows/verify-shell-fidelity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://mtg-table-engine1-git-verify-shell-528d4c-brylancreatesart-7523.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify-shell-fidelity
      - name: Audit canonical Verify ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('styles/app-src/styles-part-01.part.css').read_text()
          html=Path('index.html').read_text()
          assert css.count('/* Verify Deck reference-fidelity shell — canonical owner */')==1
          for token in ['#setup>.card{','#setup>.card:before{','#setup>.card::after{']:
              assert token not in css, token
          for element_id in ['deck','formatSelect','pasteDeckBtn','importDeckFileBtn','deckFileInput','ver','vr','legalityReport','commanderSelect','partnerSelect','saveDeckBtn','cont']:
              assert html.count(f'id="{element_id}"')==1,(element_id,html.count(f'id="{element_id}"'))
          print('Canonical Verify ownership audit passed.')
          PY
      - name: Validate JavaScript syntax
        run: node --check scripts/inline-101.js
      - name: Verify authoritative synchronization
        run: node tools/run_authoritative_sync_qa.js
      - name: Wait for current deployed Verify shell
        run: |
          for i in $(seq 1 36); do
            html=$(curl -L -s "$PREVIEW_URL/")
            css=$(curl -L -s "$PREVIEW_URL/styles/inline-01.css")
            js=$(curl -L -s "$PREVIEW_URL/scripts/inline-101.js")
            if echo "$html" | grep -q 'verifyShell' && echo "$html" | grep -q 'setupDeckVaultBtn' && echo "$css" | grep -q 'Verify Deck reference-fidelity shell' && echo "$js" | grep -q 'syncVerifyDeckCount'; then
              echo 'Current Verify shell preview is ready'
              exit 0
            fi
            echo "Waiting for current Verify preview attempt $i"
            sleep 5
          done
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run deployed app smoke through Verify and Lobby
        run: node tools/preview_smoke_test.js
      - name: Confirm Verify to Lobby behavior
        run: |
          node - <<'JS'
          const r=require('./preview-smoke-report.json');
          if(!r.ok) throw new Error('Preview smoke report is not green');
          const names=r.checks.map(x=>x.name);
          for(const required of ['guest Verify both','commander options both','Verify → Lobby both']){
            if(!names.includes(required)) throw new Error('Missing smoke assertion: '+required);
          }
          console.log('Verify shell passed deployed Verify → Lobby smoke.');
          JS
