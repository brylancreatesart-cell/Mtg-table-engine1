name: Verify shell precision alignment implementation

on:
  push:
    branches:
      - verify-shell-fidelity
    paths:
      - .github/workflows/verify-shell-fidelity.yml
      - tools/apply_verify_shell_precision_polish.py

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify-shell-fidelity
      - name: Calibrate canonical Verify layout owner
        run: python tools/apply_verify_shell_precision_polish.py
      - name: Rebuild generated runtime from canonical source
        run: python tools/build_runtime_from_source.py
      - name: Audit canonical Verify ownership and shared centerline
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('styles/app-src/styles-part-01.part.css').read_text()
          html=Path('index.html').read_text()
          marker='/* Verify Deck reference-fidelity shell — canonical owner */'
          assert css.count(marker)==1, css.count(marker)
          block=css[css.index(marker):]
          next_comment=block.find('\n/* ',len(marker))
          if next_comment>=0:block=block[:next_comment]
          assert '!important' not in block
          for token in ['#setup>.card{','#setup>.card:before{','#setup>.card::after{']:
              assert token not in css,token
          for required in ['--verify-content-width:620px','width:min(100%,var(--verify-content-width))','grid-template-columns:repeat(2,minmax(0,1fr))','text-align-last:center']:
              assert required in block, required
          for element_id in ['deck','formatSelect','pasteDeckBtn','importDeckFileBtn','deckFileInput','ver','vr','legalityReport','commanderSelect','partnerSelect','saveDeckBtn','cont']:
              assert html.count(f'id="{element_id}"')==1,(element_id,html.count(f'id="{element_id}"'))
          print('Precision Verify ownership and centerline audit passed.')
          PY
      - name: Validate JavaScript syntax
        run: node --check scripts/inline-101.js
      - name: Run authoritative sync QA
        run: node tools/run_authoritative_sync_qa.js
      - name: Commit precision alignment implementation
        run: |
          git config user.name "brylancreatesart-cell"
          git config user.email "brylancreatesart@gmail.com"
          git add styles/app-src/styles-part-01.part.css styles/inline-01.css runtime-build-report.json authoritative-sync-qa.json
          if git diff --cached --quiet; then
            echo "No precision alignment changes to commit"
          else
            git commit -m "Calibrate Verify Deck alignment and typography"
            git push origin HEAD:verify-shell-fidelity
          fi
