name: Premium cohesion preview smoke
# current validation target: phone-down Sidekick behavior

on:
  push:
    branches:
      - premium-cohesion-pass
    paths:
      - .github/workflows/premium-preview-smoke.yml
      - index.html
      - styles/inline-01.css
      - scripts/inline-101.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://mtg-table-engine1-git-premium-cohe-6cdabc-brylancreatesart-7523.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: premium-cohesion-pass
      - name: Wait for current phone-down preview
        run: |
          for i in $(seq 1 36); do
            css=$(curl -L -s -o /tmp/app.css -w '%{http_code}' "$PREVIEW_URL/styles/inline-01.css" || true)
            js=$(curl -L -s -o /tmp/app.js -w '%{http_code}' "$PREVIEW_URL/scripts/inline-101.js" || true)
            if [ "$css" = "200" ] && [ "$js" = "200" ] && grep -q 'function companionAttentionState' /tmp/app.js && grep -q 'SIDEKICK MONITORING · TAP FOR CONTROLS' /tmp/app.js && grep -q 'forcedHudAwakeTimer=setTimeout' /tmp/app.js && grep -q '.battleScreen.companionAttention .playerHud' /tmp/app.css; then
              echo 'Current phone-down preview is ready'
              exit 0
            fi
            echo "Waiting for current phone-down preview ($css/$js) attempt $i"
            sleep 5
          done
          exit 1
      - name: Verify authoritative sync
        run: node tools/run_authoritative_sync_qa.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run deployed phone-down smoke
        run: node tools/phone_down_preview_smoke.js
      - name: Verify phone-down runtime survived smoke
        run: |
          node - <<'JS'
          const r=require('./phone-down-smoke-report.json');
          if(!r.ok) throw new Error('Phone-down smoke report is not green');
          const names=r.checks.map(x=>x.name);
          for(const required of ['opponent-turn player enters passive Sidekick mode','passive mode exposes monitoring control','passive control identifies Sidekick monitoring','tap immediately reopens full controls','manual wake automatically returns to passive mode after grace period','no uncaught browser errors']){
            if(!names.includes(required)) throw new Error('Missing smoke assertion: '+required);
          }
          console.log('Phone-down Sidekick passed deployed multiplayer behavior smoke.');
          JS
